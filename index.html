<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百进制时钟</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2c54c9;
            --secondary-color: #f8f9fa;
            --text-color: #2c3e50;
            --light-text: #7f8c8d;
            --white: #fff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 50px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --clock-bg: #fff;
            --body-bg: #f8f9fa;
            --footer-text: #7f8c8d;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--body-bg);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: var(--transition);
            position: relative;
            padding-bottom: 80px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 1s ease-out;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 2.5rem;
            margin-bottom: 10px;
            animation: slideDown 0.8s ease-out;
        }

        .clock-container {
            background-color: var(--clock-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 40px;
            text-align: center;
            width: 100%;
            transition: var(--transition);
            border: 1px solid rgba(0, 0, 0, 0.05);
            animation: pulse 2s infinite alternate;
        }

        .clock-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .clock-label {
            font-size: 1.2rem;
            color: var(--light-text);
            width: 80px;
            text-align: right;
            transition: var(--transition);
        }

        .clock-display {
            font-size: clamp(2rem, 6vw, 3rem);
            color: var(--primary-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .clock-digit {
            display: inline-block;
            transition: transform 0.3s ease-out;
            width: 1.2em;
            text-align: center;
            position: relative;
        }

        .colon {
            opacity: 0.6;
            animation: blink 2s infinite;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: var(--footer-text);
            font-size: 0.9rem;
            animation: fadeIn 2s ease-out;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: var(--white);
            color: var(--primary-color);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            z-index: 100;
            transition: var(--transition);
        }

        .back-button:hover {
            transform: scale(1.1);
            background-color: var(--primary-color);
            color: var(--white);
        }

        /* 动画关键帧 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from { 
                opacity: 0;
                transform: translateY(-30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.01); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }

        @keyframes digitFlip {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        @media (min-width: 768px) {
            .back-button {
                position: absolute;
                top: 20px;
                left: 20px;
            }
            
            .back-button:hover {
                transform: translateX(-5px) scale(1.1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>百进制时钟</h1>
            <p>24小时制时针 + 100进制分秒</p>
        </div> 
        <a href="https://tundrey.org/index.html" class="back-button" title="返回首页">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div class="clock-container">
            <div class="clock-row">
                <div class="clock-label">24小时制:</div>
                <div class="clock-display" id="standard-clock">
                    <span class="clock-digit" id="std-hours">00</span>
                    <span class="colon">:</span>
                    <span class="clock-digit" id="std-minutes">00</span>
                    <span class="colon">:</span>
                    <span class="clock-digit" id="std-seconds">00</span>
                </div>
            </div>
            
            <div class="clock-row">
                <div class="clock-label">百进制:</div>
                <div class="clock-display" id="centesimal-clock">
                    <span class="clock-digit" id="centesimal-hours">00</span>
                    <span class="colon">:</span>
                    <span class="clock-digit" id="centesimal-minutes">00</span>
                    <span class="colon">:</span>
                    <span class="clock-digit" id="centesimal-seconds">00</span>
                </div>
            </div>
            
            <div class="mt-4 text-muted">
                <small>百进制分秒: 100分钟=1小时, 100秒=1分钟</small>
            </div>
        </div>
    </div>

    <div class="footer">
    power by ChatGPT    © 2025 Tundrey's Website. All rights reserved. 
    </div>

    <script>
        // 存储上一次的值用于比较
        let lastStdHours = '00';
        let lastStdMinutes = '00';
        let lastStdSeconds = '00';
        let lastCentesimalHours = '00';
        let lastCentesimalMinutes = '00';
        let lastCentesimalSeconds = '00';

        // 平滑过渡的百进制秒针
        let smoothCentesimalSeconds = 0;

        // 高精度时钟更新
        function updateClocks(timestamp) {
            const now = new Date();
            
            // 更新24小时制时钟
            const stdHours = now.getHours().toString().padStart(2, '0');
            const stdMinutes = now.getMinutes().toString().padStart(2, '0');
            const stdSeconds = now.getSeconds().toString().padStart(2, '0');
            
            document.getElementById('std-hours').textContent = stdHours;
            document.getElementById('std-minutes').textContent = stdMinutes;
            document.getElementById('std-seconds').textContent = stdSeconds;
            
            // 计算百进制时间
            const totalSecondsToday = (now.getHours() * 3600) + 
                                    (now.getMinutes() * 60) + 
                                    now.getSeconds() + 
                                    (now.getMilliseconds() / 1000);
            
            // 百进制计算 (100分钟=1小时, 100秒=1分钟)
            const centesimalHours = now.getHours(); // 小时保持24小时制
            
            // 计算百进制分钟 (100分钟=1小时)
            const centesimalMinutes = Math.floor((totalSecondsToday % 3600) / 36);
            
            // 平滑过渡的百进制秒针计算
            // 36秒标准时间 = 100百进制秒
            smoothCentesimalSeconds = (totalSecondsToday % 36) * (100 / 36);
            
            // 确保秒数在0-99.999...之间
            if (smoothCentesimalSeconds >= 100) {
                smoothCentesimalSeconds = 0;
            }
            
            const centesimalHoursStr = centesimalHours.toString().padStart(2, '0');
            const centesimalMinutesStr = centesimalMinutes.toString().padStart(2, '0');
            const centesimalSecondsStr = Math.floor(smoothCentesimalSeconds).toString().padStart(2, '0');
            
            // 更新百进制显示
            document.getElementById('centesimal-hours').textContent = centesimalHoursStr;
            document.getElementById('centesimal-minutes').textContent = centesimalMinutesStr;
            document.getElementById('centesimal-seconds').textContent = centesimalSecondsStr;
            
            // 检查哪些数字变化了并添加动画
            if (lastStdHours !== stdHours) {
                animateDigit('std-hours');
            }
            if (lastStdMinutes !== stdMinutes) {
                animateDigit('std-minutes');
            }
            if (lastStdSeconds !== stdSeconds) {
                animateDigit('std-seconds');
            }
            if (lastCentesimalHours !== centesimalHoursStr) {
                animateDigit('centesimal-hours');
            }
            if (lastCentesimalMinutes !== centesimalMinutesStr) {
                animateDigit('centesimal-minutes');
            }
            if (lastCentesimalSeconds !== centesimalSecondsStr) {
                animateDigit('centesimal-seconds');
            }
            
            // 更新上一次的值
            lastStdHours = stdHours;
            lastStdMinutes = stdMinutes;
            lastStdSeconds = stdSeconds;
            lastCentesimalHours = centesimalHoursStr;
            lastCentesimalMinutes = centesimalMinutesStr;
            lastCentesimalSeconds = centesimalSecondsStr;
            
            // 使用requestAnimationFrame实现平滑更新
            requestAnimationFrame(updateClocks);
        }

        // 数字翻转动画
        function animateDigit(id) {
            const digit = document.getElementById(id);
            digit.style.animation = 'none';
            // 触发重绘
            void digit.offsetWidth;
            digit.style.animation = 'digitFlip 0.5s ease-out';
        }

        // 初始调用
        document.addEventListener('DOMContentLoaded', () => {
            // 添加加载动画
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 1s ease-out';
                document.body.style.opacity = '1';
            }, 100);
            
            requestAnimationFrame(updateClocks);
        });
    </script>
</body>
</html>
